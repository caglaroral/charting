# docker compose up -d --build   ->  http://<host>:8080
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      JSRUN_SOCKET: /run/jsrun/jsrun.sock
      BACKTESTER_URL: http://backtester:8090
    # Mount .env so SECRET_KEY generated on first start is persisted on the host
    volumes:
      - ./.env:/app/.env
      - jsrun:/run/jsrun
    depends_on:
      jsworker:
        condition: service_healthy
    restart: unless-stopped

  # Runs indicator code for server-side alerts, including user-written custom indicators.
  # No network at all, read-only, no capabilities, unprivileged user, no secrets in its environment.
  # The backend talks to it only through the Unix socket on the "jsrun" volume.
  jsworker:
    build:
      context: .
      dockerfile: docker/jsworker.Dockerfile
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 64
    volumes:
      - jsrun:/run/jsrun
    restart: unless-stopped

  # Backtest engine (numpy / numba / TA-Lib): screener, strategy tester, paper trading. Reached only by the
  # backend on the compose network (no published port). Reads ClickHouse with the data source settings the
  # backend sends per request (SELECT only); gets no secrets in its environment. Network: ClickHouse and the
  # exchange REST API (top-up of symbols missing from the recent 1m table).
  backtester:
    build:
      context: .
      dockerfile: docker/backtester.Dockerfile
    read_only: true
    tmpfs:
      - /cache:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1500m
    pids_limit: 64
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jsrun:
