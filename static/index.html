<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 12l4-5 3 3 6-8' stroke='%232962ff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/vendor/codemirror/material-darker.css">
</head>
<body>

<!-- Login -->
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" width="28" height="28"><path d="M2 18l6-7 4 4 9-11" stroke="#2962ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Charting</span>
    </div>
    <label>Username<input name="username" id="login-user" autocomplete="username" required></label>
    <label>Password<input name="password" id="login-pass" type="password" autocomplete="current-password" required></label>
    <div class="login-error" id="login-error"></div>
    <button type="submit" class="btn primary" id="login-submit">Sign in</button>
    <div class="login-note" id="login-note"></div>
  </form>
</div>

<div id="app" class="app" hidden>
  <!-- Top bar -->
  <header class="topbar">
    <button class="tb-btn symbol-btn" id="symbol-btn" title="Symbol search (or just start typing)">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2"/></svg>
      <span id="symbol-label">—</span>
    </button>
    <div class="sep"></div>
    <div class="tf-group" id="tf-group"></div>
    <div class="dropdown" id="tf-more"></div>
    <div class="sep"></div>
    <div class="dropdown" id="charttype"></div>
    <div class="sep"></div>
    <button class="tb-btn" id="btn-indicators" title="Indicators (/)">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 17l5-6 4 3 5-8 4 4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 21h18" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Indicators</span>
    </button>
    <button class="tb-btn" id="btn-editor" title="Custom indicator editor">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
      <span>Editor</span>
    </button>
    <button class="tb-btn" id="btn-alert" title="Add price alert (Alt+A)">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <span>Alert</span>
    </button>
    <div class="sep"></div>
    <button class="tb-btn icon" id="btn-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    <button class="tb-btn icon" id="btn-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    <div class="spacer"></div>
    <span class="status-dot" id="status" title="Data status"></span>
    <button class="tb-btn icon" id="btn-screenshot" title="Screenshot"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 8h3l2-3h6l2 3h3v11H4z" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    <button class="tb-btn icon" id="btn-fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    <button class="tb-btn icon" id="btn-togglepanel" title="Toggle right panel"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="4" width="18" height="16" rx="1" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M15 4v16" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <div class="dropdown" id="user-menu"></div>
  </header>

  <!-- Left toolbar -->
  <nav class="lefttools" id="lefttools"></nav>

  <!-- Chart -->
  <main class="chartwrap" id="chartwrap">
    <div id="chart" class="chart"></div>
    <div class="legend" id="legend"></div>
    <div id="pane-legends"></div>
    <div class="drawbar" id="drawbar" hidden></div>
    <div class="chart-msg" id="chart-msg" hidden></div>
  </main>

  <!-- Right panel -->
  <aside class="rightpanel" id="rightpanel">
    <div class="rp-tabs">
      <button class="rp-tab active" data-tab="watchlist">Watchlist</button>
      <button class="rp-tab" data-tab="alerts">Alerts <span class="badge" id="alert-badge" hidden></span></button>
    </div>
    <section class="rp-section" id="tab-watchlist">
      <div class="wl-head">
        <div class="dropdown" id="wl-select"></div>
        <div class="spacer"></div>
        <button class="tb-btn icon" id="wl-add" title="Add symbol"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <div class="dropdown" id="wl-menu"></div>
      </div>
      <div class="wl-cols"><span>Symbol</span><span>Last</span><span>Chg</span><span>Chg%</span></div>
      <div class="wl-list" id="wl-list"></div>
      <div class="symbol-info" id="symbol-info"></div>
    </section>
    <section class="rp-section" id="tab-alerts" hidden>
      <div class="al-head">
        <button class="btn small" id="al-new">+ Price alert</button>
        <div class="spacer"></div>
        <button class="btn small ghost" id="al-notify" title="Allow browser notifications">Notifications</button>
      </div>
      <div class="al-list" id="al-list"></div>
      <div class="al-subhead">Tetiklenenler</div>
      <div class="al-log" id="al-log"></div>
    </section>
  </aside>

  <!-- Bottom bar -->
  <footer class="bottombar">
    <div class="ranges" id="ranges"></div>
    <div class="spacer"></div>
    <span class="clock" id="clock"></span>
    <div class="dropdown" id="tz-select"></div>
    <div class="sep"></div>
    <button class="bb-btn" id="btn-pct" title="Percent scale">%</button>
    <button class="bb-btn" id="btn-log" title="Logarithmic scale">log</button>
    <button class="bb-btn active" id="btn-auto" title="Auto scale">auto</button>
  </footer>
</div>

<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>

<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/vendor/codemirror/codemirror.js"></script>
<script src="/vendor/codemirror/javascript.js"></script>
<script src="/vendor/codemirror/matchbrackets.js"></script>
<script src="/vendor/codemirror/closebrackets.js"></script>
<script src="/vendor/codemirror/comment.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
